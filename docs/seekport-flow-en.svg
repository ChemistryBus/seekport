<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="seekport-flow-en-title seekport-flow-en-desc">
  <title id="seekport-flow-en-title">seekport: before and after</title>
  <desc id="seekport-flow-en-desc">Without seekport, an agent behind a third-party gateway cannot use WebFetch or DeepSeek search filters and gets no live web content. With seekport, the agent calls the same core through a Skill or MCP server, then DeepSeek's official Search and Fetch APIs return ranked results or Markdown that the agent can cite.</desc>
  <defs>
    <marker id="sp-en-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
    <marker id="sp-en-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f9f"/>
    </marker>
  </defs>

  <rect width="1200" height="740" fill="#f5f5f5"/>

  <text x="40" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#2d3142">seekport</text>
  <text x="40" y="70" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">Before / after: web search and fetch for agents running on DeepSeek</text>

  <rect x="32" y="104" width="552" height="600" rx="10" fill="#ffffff" stroke="#d9dde3"/>
  <rect x="616" y="104" width="552" height="600" rx="10" fill="#ffffff" stroke="#d9dde3"/>

  <text x="64" y="132" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#8b93a1">WITHOUT SEEPORT</text>
  <text x="64" y="150" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b93a1">no live web access</text>

  <text x="648" y="132" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#bf4520">WITH SEEPORT</text>
  <text x="648" y="150" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#bf4520">live search + fetch</text>

  <!-- connectors first, so lines sit behind boxes -->
  <line x1="308" y1="228" x2="308" y2="252" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#sp-en-arrow-muted)"/>
  <line x1="308" y1="314" x2="308" y2="338" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#sp-en-arrow-muted)"/>
  <line x1="308" y1="432" x2="308" y2="622" stroke="#8b93a1" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#sp-en-arrow-muted)"/>

  <line x1="892" y1="228" x2="892" y2="252" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#sp-en-arrow-muted)"/>
  <line x1="892" y1="314" x2="892" y2="338" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#sp-en-arrow-muted)"/>
  <line x1="892" y1="408" x2="892" y2="436" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#sp-en-arrow-muted)"/>
  <line x1="892" y1="522" x2="892" y2="622" stroke="#2f6f9f" stroke-width="1.5" marker-end="url(#sp-en-arrow-link)"/>

  <rect x="316" y="516" width="82" height="18" fill="#f5f5f5"/>
  <text x="320" y="529" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#8b93a1">NO FALLBACK</text>

  <!-- left column -->
  <rect x="108" y="172" width="400" height="56" rx="6" fill="#f2f4f7" stroke="#cfd5dc"/>
  <text x="124" y="187" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#8b93a1">AGENT</text>
  <text x="124" y="209" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2d3142">Agent</text>
  <text x="124" y="223" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7280">Claude Code · Codex · Zcode</text>

  <rect x="108" y="258" width="400" height="56" rx="6" fill="#ffffff" stroke="#cfd5dc"/>
  <text x="124" y="273" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#8b93a1">GATEWAY</text>
  <text x="124" y="295" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2d3142">Third-party gateway</text>
  <text x="124" y="309" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7280">no server-side search tool</text>

  <rect x="108" y="344" width="400" height="88" rx="6" fill="#fdf3f1" stroke="#e3b8af"/>
  <text x="124" y="359" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#b06a5d">FAIL</text>
  <text x="124" y="381" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#a33a2a">WebFetch blocked</text>
  <text x="124" y="399" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b5b52">Unable to verify if domain is safe to fetch</text>
  <text x="124" y="415" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b5b52">No site:/lang:/after: filters</text>

  <rect x="108" y="628" width="400" height="56" rx="6" fill="#f7f7f7" stroke="#d9dde3"/>
  <text x="124" y="643" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#8b93a1">RESULT</text>
  <text x="124" y="665" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4b5563">No live web content</text>
  <text x="124" y="679" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b93a1">stale, guessed, or uncited answer</text>

  <!-- right column -->
  <rect x="692" y="172" width="400" height="56" rx="6" fill="#f2f4f7" stroke="#cfd5dc"/>
  <text x="708" y="187" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#8b93a1">AGENT</text>
  <text x="708" y="209" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2d3142">Agent</text>
  <text x="708" y="223" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7280">Claude Code · Codex · Zcode</text>

  <rect x="692" y="258" width="400" height="56" rx="6" fill="#ffffff" stroke="#cfd5dc"/>
  <text x="708" y="273" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#8b93a1">BRIDGE</text>
  <text x="708" y="295" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2d3142">Skill or MCP</text>
  <text x="708" y="309" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7280">CLI · stdio tools/call</text>

  <rect x="692" y="344" width="400" height="64" rx="6" fill="#fdf1ec" stroke="#bf4520" stroke-width="2"/>
  <text x="708" y="359" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#bf4520">CORE</text>
  <text x="708" y="382" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bf4520">seekport</text>
  <text x="708" y="398" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b5b52">zero deps · filters · retries · budget</text>

  <rect x="692" y="442" width="400" height="80" rx="6" fill="#eef5fa" stroke="#b9d2e3"/>
  <text x="708" y="457" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#2f6f9f">API</text>
  <text x="708" y="479" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2d3142">DeepSeek official API</text>
  <text x="708" y="497" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#2f6f9f">/v1/tools/search · /v1/tools/fetch</text>
  <text x="708" y="513" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7280">rerank_score · authority · Markdown</text>

  <rect x="692" y="628" width="400" height="56" rx="6" fill="#eef7f2" stroke="#b7d8c7"/>
  <text x="708" y="643" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#2e6b4f">RESULT</text>
  <text x="708" y="665" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2e6b4f">Answer with a cited URL</text>
  <text x="708" y="679" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4b7d62">verifiable, current, filterable</text>
</svg>
